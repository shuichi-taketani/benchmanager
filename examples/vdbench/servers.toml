# 負荷サーバ(SSH 接続先)の定義
# 秘匿情報を含むため .gitignore 対象にしやすいよう test.toml と分離してある

[[servers]]
name = "bench1"
host = "bench1.example.com"
user = "bench"
ssh_key = "~/.ssh/id_ed25519"
vdbench_path = "/opt/vdbench"
workdir = "/tmp/benchman"

