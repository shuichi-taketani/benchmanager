# Benchmark Manager 日本語メッセージ定義
# キーは i18n.t() のドット区切りキーに対応する

[app]
name = "Benchmark Manager"
description = "ストレージベンチマーク自動化ツール"

[config]
dir_not_found = "設定ディレクトリが見つかりません: {path}"
file_not_found = "設定ファイルが見つかりません: {path}(設定ディレクトリ {dir} に {name} が必要です)"
toml_syntax_error = "[{file}] TOML の構文エラー: {message}"
validation_header = "[{file}] 設定の検証に失敗しました({count} 件)"
validation_item = "  - キー '{key}'{line_info}: {message}(入力値: {value})"
validation_item_no_value = "  - キー '{key}'{line_info}: {message}"
line_info = " ({file} {line} 行目)"
extra_key = "定義されていないキーです。スペルミスの可能性があります"
missing_key = "必須キーが指定されていません"
ok = "設定は正常です: {path}"
ok_files = "  検証済みファイル: {files}"
unknown_tool = "[{file}] tool '{tool}' に対応するドライバがありません。利用可能: {available}"
strategy_not_supported = "[{file}] strategy.type '{strategy}' はドライバ '{tool}' では利用できません。利用可能: {available}"
matrix_not_sweepable = "[{file}] matrix のキー '{key}' は掃引できません。matrix には sweepable なツールパラメータ({sweepable})または env_params 定義名({env_params})のみ指定できます"
matrix_empty = "[{file}] matrix のキー '{key}' の値が空です。1 つ以上の値を指定してください"
env_value_not_defined = "[{file}] env_params '{name}' の値 '{value}' に対応する apply 定義がありません"
env_matrix_value_unknown = "[{file}] matrix の '{name}' に指定された値 '{value}' は env_params.{name}.values に含まれていません"
max_load_manual_missing = "[{file}] strategy.max_load.mode = \"manual\" の場合は manual_iops を指定してください"
range_param_missing = "[{file}] strategy.type = \"range\" では {key} が必須です"
range_step_zero = "[{file}] strategy.step_iops は 0 以外を指定してください"
range_step_direction = "[{file}] strategy.step_iops の符号が start_iops({start}) から end_iops({end}) への向きと一致しません"
tool_param_unknown = "[{file}] tool_params のキー '{key}' は {tool} のパラメータ定義にありません。定義外パラメータは [tool_params.raw] に記述してください。利用可能: {available}"
tool_param_invalid = "[{file}] tool_params.{key}: {message}"
server_not_found = "[{file}] サーバ '{name}' が servers.toml に定義されていません"
servers_empty = "[{file}] servers に最低 1 台のサーバを定義してください"
storage_management_required = "[{file}] env_params '{name}' は target=\"storage\" ですが storage.toml に [storage.management] がありません"

[engine]
suite_start = "テストスイート '{suite}' を開始します(条件数: {count}、ツール: {tool})"
suite_done = "テストスイート '{suite}' が完了しました(成功: {ok} / 失敗: {failed}、結果: {path})"
run_start = "[{index}/{total}] 条件を開始: {conditions}"
run_done = "[{index}/{total}] 条件が完了しました(測定点: {points})"
run_failed = "[{index}/{total}] 条件が失敗しました: {reason}"
measure_start = "  測定開始 target_iops={target}(warmup={warmup}s, duration={duration}s)"
measure_done = "  測定完了 target_iops={target} → iops={iops:.1f}, latency_avg={latency:.3f}ms"
measure_retry = "  測定失敗のためリトライします target_iops={target}: {reason}"
measure_failed = "  測定がリトライ後も失敗しました target_iops={target}: {reason}"
measure_max_start = "  最大負荷測定を開始します(iorate=max)"
max_load_adopted = "  最大負荷を採用: {iops:.1f} IOPS(latency={latency:.3f}ms >= 閾値 {threshold}ms)"
max_load_insufficient = "負荷不十分: 実測 latency {latency:.3f}ms が閾値 {threshold}ms 未満のため飽和していません(最大負荷 {iops:.1f} IOPS)"
max_load_manual = "  最大負荷に設定値を使用します: {iops} IOPS"
iops_shortfall = "  目標 IOPS 未達(飽和領域の可能性): target={target}, 実測={actual:.1f}({pct:.1f}%)"
strategy_stopped = "  停止条件が成立したため測定を終了します"
max_iterations = "  上限回数 {max_iterations} 回に達したため測定を終了します"
fail_fast = "--fail-fast が指定されているため実行を中止します"
strategy_unsupported = "戦略 '{strategy}' はドライバ '{tool}' では利用できません。利用可能: {available}"
results_dir = "結果ディレクトリ: {path}"
dry_run = "dry-run のため実行しません"

[envparams]
apply = "環境パラメータを適用: {name}={value}(target={target})"
apply_skip = "環境パラメータは変更なしのためスキップ: {name}={value}"
command = "  実行: {command}"
command_failed = "環境パラメータ '{name}={value}' のコマンドが失敗しました(終了コード {rc}): {command}\n{output}"
verify_ok = "  verify 成功: {command}"
verify_failed = "環境パラメータ '{name}={value}' の verify が失敗しました(終了コード {rc}): {command}\n{output}"
script_missing = "環境パラメータ '{name}' の script が見つかりません: {path}"
no_executor = "環境パラメータ '{name}' の target='{target}' に対応する実行先が設定されていません"

[remote]
connect = "接続します: {user}@{host}"
connect_failed = "SSH 接続に失敗しました: {host}: {message}"
reconnect = "SSH が切断されたため再接続します: {host}"
command_failed = "リモートコマンドが失敗しました(終了コード {rc}): {command}\n{output}"
upload = "  転送: {path}"
download = "  回収: {path}"

[driver]
unknown = "ドライバ '{tool}' は登録されていません。利用可能: {available}"
flatfile_missing = "flatfile が見つかりません: {path}"
summary_row_missing = "flatfile に集計行(avg_*)がありません: {path}"
parse_failed = "出力のパースに失敗しました: {path}: {message}"
exit_nonzero = "{tool} が異常終了しました(終了コード {rc})"
max_not_supported = "ドライバ '{tool}' は最大負荷測定(iorate=max)に対応していません"
no_luns = "[{file}] storage.luns が空です。測定対象の lun(またはファイルパス)を 1 つ以上指定してください"

[store]
db_created = "データベースを作成しました: {path}"

[importing]
start = "結果ディレクトリを取り込みます: {path}"
manifest_missing = "manifest.toml が見つかりません: {path}"
done = "取り込み完了: テスト条件 {runs} 件、測定点 {measurements} 件、メトリクス {metrics} 件"
replaced = "既存のテストスイート '{suite}' を置き換えました"

[report]
title = "{suite} IOPS-Latency カーブ"
subtitle = "ツール: {tool} / 測定点: {points} / 生成日時: {created}"
xaxis = "IOPS(実測)"
yaxis = "平均レイテンシ (ms)"
legend_ok = "正常"
legend_warn = "目標 IOPS 未達"
legend_failed = "失敗"
hover_target = "目標 IOPS"
hover_iops = "実測 IOPS"
hover_latency = "平均レイテンシ"
hover_latency_max = "最大レイテンシ"
hover_measurement = "測定 ID"
no_data = "テストスイート '{suite}' に表示できる測定データがありません"
suite_not_found = "テストスイート '{suite}' が見つかりません。登録済み: {available}"
written = "レポートを出力しました: {path}"
condition_title = "{conditions}"

[plan]
header = "テスト計画: スイート '{suite}'(ツール: {tool}、戦略: {strategy})"
env_order = "環境パラメータの適用順(外側 → 内側): {order}"
env_order_none = "環境パラメータの定義はありません"
conditions_header = "テスト条件の展開結果({count} 件)"
condition_line = "  {index:>3}. {conditions}"
switch_count = "環境パラメータ切替回数: {count} 回(最適化前: {naive} 回)"
estimated = "推定所要時間: {duration}(1 測定点あたり {per_point} 秒 × 推定 {points} 点)"
estimated_note = "  ※ 測定点数は戦略の上限回数からの概算です"
points_per_run = "1 条件あたりの推定測定点数: {points}"

[params]
header = "{tool} のパラメータ定義({count} 件)"
group = "[{group}]"
column_name = "名前"
column_type = "型"
column_default = "既定値"
column_range = "範囲"
column_sweepable = "掃引"
column_label = "説明"
raw_note = "定義外のパラメータは [tool_params.raw] に記述すると無検証でドライバへ渡されます"

[cli]
app_help = "ストレージベンチマーク自動化ツール(Phase 1: vdbench / モック)"
run_help = "設定ディレクトリを読み込みテストを実行します"
plan_help = "マトリクス展開と推定所要時間を表示します(dry-run)"
config_help = "設定ファイルの操作"
validate_help = "設定ディレクトリ内の 3 ファイルを検証します"
import_help = "結果ディレクトリから DB を再構築します"
report_help = "テストスイートの HTML レポートを生成します"
params_help = "ツール固有パラメータの一覧を表示します"
opt_config_dir = "設定ディレクトリ(既定: ./config)"
opt_test_config = "test.toml のパスを個別指定"
opt_servers_config = "servers.toml のパスを個別指定"
opt_storage_config = "storage.toml のパスを個別指定"
opt_results_dir = "結果ディレクトリの出力先(既定: ./results)"
opt_db = "SQLite ファイルのパス"
opt_output = "出力ファイルのパス"
opt_fail_fast = "測定が失敗した時点で全体を停止します"
opt_verbose = "詳細ログを出力します"
opt_lang = "メッセージ言語(ja/en)"
error_prefix = "エラー: "
aborted = "中断しました"
