# Benchmark Manager English messages (fallback locale)

[app]
name = "Benchmark Manager"
description = "Storage benchmark automation tool"

[config]
dir_not_found = "Config directory not found: {path}"
file_not_found = "Config file not found: {path} ({name} is required in config directory {dir})"
toml_syntax_error = "[{file}] TOML syntax error: {message}"
validation_header = "[{file}] Config validation failed ({count} error(s))"
validation_item = "  - key '{key}'{line_info}: {message} (given: {value})"
validation_item_no_value = "  - key '{key}'{line_info}: {message}"
line_info = " ({file} line {line})"
extra_key = "Unknown key (possible typo)"
missing_key = "Required key is missing"
ok = "Config is valid: {path}"
ok_files = "  Validated files: {files}"
unknown_tool = "[{file}] No driver for tool '{tool}'. Available: {available}"
strategy_not_supported = "[{file}] strategy.type '{strategy}' is not supported by driver '{tool}'. Available: {available}"
matrix_not_sweepable = "[{file}] matrix key '{key}' is not sweepable. Only sweepable tool params ({sweepable}) or env_params names ({env_params}) are allowed"
matrix_empty = "[{file}] matrix key '{key}' has no values"
env_value_not_defined = "[{file}] env_params '{name}' has no apply definition for value '{value}'"
env_matrix_value_unknown = "[{file}] matrix value '{value}' for '{name}' is not in env_params.{name}.values"
max_load_manual_missing = "[{file}] manual_iops is required when strategy.max_load.mode = \"manual\""
range_param_missing = "[{file}] {key} is required for strategy.type = \"range\""
range_step_zero = "[{file}] strategy.step_iops must not be 0"
range_step_direction = "[{file}] sign of strategy.step_iops does not match direction from start_iops({start}) to end_iops({end})"
tool_param_unknown = "[{file}] tool_params key '{key}' is not defined for {tool}. Use [tool_params.raw] for undefined params. Available: {available}"
tool_param_invalid = "[{file}] tool_params.{key}: {message}"
server_not_found = "[{file}] server '{name}' is not defined in servers.toml"
servers_empty = "[{file}] at least one server must be defined"
storage_management_required = "[{file}] env_params '{name}' targets storage but storage.toml has no [storage.management]"

[engine]
suite_start = "Starting test suite '{suite}' (conditions: {count}, tool: {tool})"
suite_done = "Test suite '{suite}' finished (ok: {ok} / failed: {failed}, results: {path})"
run_start = "[{index}/{total}] Starting condition: {conditions}"
run_done = "[{index}/{total}] Condition finished (points: {points})"
run_failed = "[{index}/{total}] Condition failed: {reason}"
measure_start = "  Measuring target_iops={target} (warmup={warmup}s, duration={duration}s)"
measure_done = "  Done target_iops={target} -> iops={iops:.1f}, latency_avg={latency:.3f}ms"
measure_retry = "  Retrying failed measurement target_iops={target}: {reason}"
measure_failed = "  Measurement failed after retry target_iops={target}: {reason}"
measure_max_start = "  Measuring maximum load (iorate=max)"
max_load_adopted = "  Max load adopted: {iops:.1f} IOPS (latency={latency:.3f}ms >= threshold {threshold}ms)"
max_load_insufficient = "Insufficient load: measured latency {latency:.3f}ms is below threshold {threshold}ms (not saturated, max load {iops:.1f} IOPS)"
max_load_manual = "  Using configured max load: {iops} IOPS"
iops_shortfall = "  Target IOPS not reached (possibly saturated): target={target}, actual={actual:.1f} ({pct:.1f}%)"
strategy_stopped = "  Stop condition met"
max_iterations = "  Reached max_iterations {max_iterations}"
fail_fast = "Aborting because --fail-fast was specified"
strategy_unsupported = "Strategy '{strategy}' is not supported by driver '{tool}'. Available: {available}"
results_dir = "Results directory: {path}"
dry_run = "dry-run: not executing"

[envparams]
apply = "Applying env param: {name}={value} (target={target})"
apply_skip = "Env param unchanged, skipped: {name}={value}"
command = "  exec: {command}"
command_failed = "Command for env param '{name}={value}' failed (exit {rc}): {command}\n{output}"
verify_ok = "  verify ok: {command}"
verify_failed = "Verify for env param '{name}={value}' failed (exit {rc}): {command}\n{output}"
script_missing = "Script for env param '{name}' not found: {path}"
no_executor = "No executor configured for env param '{name}' target='{target}'"

[remote]
connect = "Connecting: {user}@{host}"
connect_failed = "SSH connection failed: {host}: {message}"
reconnect = "SSH disconnected, reconnecting: {host}"
command_failed = "Remote command failed (exit {rc}): {command}\n{output}"
upload = "  upload: {path}"
download = "  download: {path}"

[driver]
unknown = "Driver '{tool}' is not registered. Available: {available}"
flatfile_missing = "flatfile not found: {path}"
summary_row_missing = "flatfile has no summary (avg_*) row: {path}"
parse_failed = "Failed to parse output: {path}: {message}"
exit_nonzero = "{tool} exited abnormally (exit {rc})"
max_not_supported = "Driver '{tool}' does not support max load measurement (iorate=max)"
no_luns = "[{file}] storage.luns is empty. Specify at least one lun (or file path)"

[store]
db_created = "Database created: {path}"

[importing]
start = "Importing results directory: {path}"
manifest_missing = "manifest.toml not found: {path}"
done = "Import finished: {runs} run(s), {measurements} measurement(s), {metrics} metric(s)"
replaced = "Replaced existing test suite '{suite}'"

[report]
title = "{suite} IOPS-Latency curves"
subtitle = "Tool: {tool} / points: {points} / generated: {created}"
xaxis = "IOPS (measured)"
yaxis = "Average latency (ms)"
legend_ok = "OK"
legend_warn = "Target IOPS not reached"
legend_failed = "Failed"
hover_target = "Target IOPS"
hover_iops = "Measured IOPS"
hover_latency = "Avg latency"
hover_latency_max = "Max latency"
hover_measurement = "Measurement ID"
no_data = "No measurement data to display for test suite '{suite}'"
suite_not_found = "Test suite '{suite}' not found. Known: {available}"
written = "Report written: {path}"
condition_title = "{conditions}"

[plan]
header = "Test plan: suite '{suite}' (tool: {tool}, strategy: {strategy})"
env_order = "Env param apply order (outer -> inner): {order}"
env_order_none = "No env params defined"
conditions_header = "Expanded test conditions ({count})"
condition_line = "  {index:>3}. {conditions}"
switch_count = "Env param switches: {count} (naive: {naive})"
estimated = "Estimated duration: {duration} ({per_point} sec/point x {points} points)"
estimated_note = "  * point count is an estimate from the strategy's iteration limit"
points_per_run = "Estimated points per condition: {points}"

[params]
header = "Parameter definitions for {tool} ({count})"
group = "[{group}]"
column_name = "name"
column_type = "type"
column_default = "default"
column_range = "range"
column_sweepable = "sweep"
column_label = "description"
raw_note = "Undefined params can be passed through untouched via [tool_params.raw]"

[cli]
app_help = "Storage benchmark automation tool (Phase 1: vdbench / mock)"
run_help = "Load a config directory and run the test"
plan_help = "Show matrix expansion and estimated duration (dry-run)"
config_help = "Config operations"
validate_help = "Validate the three files in a config directory"
import_help = "Rebuild the DB from a results directory"
report_help = "Generate an HTML report for a test suite"
params_help = "List tool specific parameters"
opt_config_dir = "Config directory (default: ./config)"
opt_test_config = "Override path to test.toml"
opt_servers_config = "Override path to servers.toml"
opt_storage_config = "Override path to storage.toml"
opt_results_dir = "Results output directory (default: ./results)"
opt_db = "Path to the SQLite file"
opt_output = "Output file path"
opt_fail_fast = "Stop the whole run on the first failure"
opt_verbose = "Verbose logging"
opt_lang = "Message language (ja/en)"
error_prefix = "Error: "
aborted = "Aborted"
